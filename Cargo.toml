[workspace]
resolver = "3"
members = [
    "crates/origin-core",
    "crates/origin-events",
    "crates/origin-platform",
    "crates/origin-secrets",
    "crates/origin-settings",
    "crates/origin-storage",
    "crates/origin-http",
    "crates/origin-auth",
    "crates/origin-connector",
    "crates/origin-accounts",
    "crates/origin-jobs",
    "crates/origin-sync",
    "crates/origin-manifest",
    "crates/origin-ai",
    "crates/origin-mcp",
    "crates/origin-xtask",
    "crates/origin-telemetry",
    "crates/origin-app",
    "adapters/origin-storage-sqlite",
    "adapters/origin-http-reqwest",
    "adapters/origin-auth-loopback",
    "adapters/origin-mcp-stdio",
    "adapters/origin-secrets-system",
    "adapters/origin-notifications-tauri",
    "host/origin-tauri",
    "examples/demo/src-tauri",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/casoon/origin"
authors = ["Jörn Seidel <joern.seidel@casoon.de>"]

[workspace.dependencies]
# --- platform crates (contracts + mechanisms) ---
origin-core = { path = "crates/origin-core", version = "0.1.0" }
origin-events = { path = "crates/origin-events", version = "0.1.0" }
origin-platform = { path = "crates/origin-platform", version = "0.1.0" }
origin-secrets = { path = "crates/origin-secrets", version = "0.1.0" }
origin-settings = { path = "crates/origin-settings", version = "0.1.0" }
origin-storage = { path = "crates/origin-storage", version = "0.1.0" }
origin-http = { path = "crates/origin-http", version = "0.1.0" }
origin-auth = { path = "crates/origin-auth", version = "0.1.0" }
origin-connector = { path = "crates/origin-connector", version = "0.1.0" }
origin-accounts = { path = "crates/origin-accounts", version = "0.1.0" }
origin-jobs = { path = "crates/origin-jobs", version = "0.1.0" }
origin-sync = { path = "crates/origin-sync", version = "0.1.0" }
origin-manifest = { path = "crates/origin-manifest", version = "0.1.0" }
origin-ai = { path = "crates/origin-ai", version = "0.1.0" }
origin-mcp = { path = "crates/origin-mcp", version = "0.1.0" }
origin-xtask = { path = "crates/origin-xtask", version = "0.1.0" }
origin-telemetry = { path = "crates/origin-telemetry", version = "0.1.0" }
origin-app = { path = "crates/origin-app", version = "0.1.0" }

# --- adapters ---
origin-storage-sqlite = { path = "adapters/origin-storage-sqlite", version = "0.1.0" }
origin-http-reqwest = { path = "adapters/origin-http-reqwest", version = "0.1.0" }
origin-auth-loopback = { path = "adapters/origin-auth-loopback", version = "0.1.0" }
origin-mcp-stdio = { path = "adapters/origin-mcp-stdio", version = "0.1.0" }
origin-secrets-system = { path = "adapters/origin-secrets-system", version = "0.1.0" }
origin-notifications-tauri = { path = "adapters/origin-notifications-tauri", version = "0.1.0" }

# --- host ---
origin-tauri = { path = "host/origin-tauri", version = "0.1.0" }

# --- third party ---
async-trait = "0.1.92"
base64 = "0.23"
getrandom = "0.4"
sha2 = "0.11"
keyring = "4.1"
reqwest = { version = "0.13", features = ["gzip"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1"
ts-rs = "12.0"
time = { version = "0.3.55", features = ["serde-well-known", "macros"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.25", features = ["v4", "serde"] }

tauri = { version = "2.11", features = ["tray-icon"] }
tauri-build = "2.6"
tauri-plugin-notification = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
