name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Only xtask is compiled here, so this job stays fast and fails early on a
      # layering violation.
      - run: cargo xtask validate

      # A hand-edited or stale generated file survives review far too easily
      # (ADR-0022).
      - run: cargo xtask generate --check

  # The template is the only derivative that exists today, so this is Origin's
  # downstream check: a platform change that breaks a generated project fails here
  # rather than in someone's repository (ADR-0026).
  template:
    name: Template builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      # The local scaffold points frontend deps at this checkout via `link:`. Those
      # packages resolve their own `workspace:*` dependencies (e.g.
      # `@origin/ui` → `@origin/client`) from *this* pnpm install, not the scaffolded
      # project's — so it has to exist before the frontend link target is used.
      - run: pnpm install --frozen-lockfile

      - name: Scaffold a project against this checkout
        run: cargo run -p xtask -- new sample-app --into "$RUNNER_TEMP" --local

      - name: The generated project passes its own rules
        working-directory: ${{ runner.temp }}/sample-app
        run: cargo run -p xtask -- validate

      - name: Generated files are current straight after scaffolding
        working-directory: ${{ runner.temp }}/sample-app
        run: cargo run -p xtask -- generate --check

      - name: The generated project builds and tests
        working-directory: ${{ runner.temp }}/sample-app
        run: cargo test

      - name: The generated frontend installs and checks
        working-directory: ${{ runner.temp }}/sample-app
        run: |
          pnpm install
          pnpm check

      - name: Install Playwright browser
        working-directory: ${{ runner.temp }}/sample-app
        run: pnpm --filter sample-app-ui exec playwright install --with-deps chromium

      - name: The generated frontend passes its E2E / accessibility smoke test
        working-directory: ${{ runner.temp }}/sample-app
        run: pnpm test:e2e

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r check
      - run: pnpm --filter @origin/demo build

      - name: Install Playwright browser
        run: pnpm --filter @origin/demo exec playwright install --with-deps chromium

      # Loads the built app outside the Tauri webview and checks it renders without a
      # crash and without accessibility violations (ADR-0010's transport boundary
      # means it degrades gracefully rather than throwing when Tauri is absent).
      - name: E2E / accessibility smoke test
        run: pnpm --filter @origin/demo test:e2e

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      # `tauri::generate_context!` reads the built frontend at compile time, so the
      # Rust build cannot start before the frontend exists.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @origin/demo build

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        # The keychain contract test is excluded here; it needs an unlocked, attended
        # credential store and is run deliberately by developers.
        run: cargo test --workspace

  # `rust-version = "1.88"` in Cargo.toml is a promise, not a hope — this is what
  # holds it to that.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @origin/demo build

      - name: Test
        run: cargo test --workspace

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit
