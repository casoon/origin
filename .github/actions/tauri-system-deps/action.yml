name: Tauri system dependencies
description: >
  Installs the webkit/gtk headers Tauri builds against on Ubuntu. The .deb files
  are kept in the Actions cache: fetching them from the Azure mirror took up to
  25 minutes (63 MB at ~40 kB/s). apt only downloads what the cache lacks.

runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: |
        echo "key=tauri-apt-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
        echo "prefix=tauri-apt-${ImageOS}-" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: ${{ steps.image.outputs.key }}
        restore-keys: ${{ steps.image.outputs.prefix }}

    - shell: bash
      run: |
        mkdir -p ~/apt-archives/partial
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          -o Dir::Cache::Archives="$HOME/apt-archives/" \
          -o APT::Keep-Downloaded-Packages=true \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libsoup-3.0-dev
        sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
        sudo chown -R "$USER" ~/apt-archives
        echo "$(ls ~/apt-archives/*.deb | wc -l) packages in the apt cache"
