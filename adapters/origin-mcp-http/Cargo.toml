[package]
name = "origin-mcp-http"
description = "MCP over a local loopback HTTP endpoint: the transport a desktop AI client uses to reach an already-running GUI instance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["mcp", "http", "loopback", "transport", "ai"]
categories = ["artificial-intelligence", "web-programming::http-server"]

[dependencies]
getrandom = { workspace = true }
origin-domain = { workspace = true }
origin-mcp-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
origin-platform = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-util = { workspace = true }

[lints]
workspace = true