name: Release

# Tag-driven: `git tag v1.2.0 && git push --tags`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, label: macos-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, label: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: windows-x86_64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, label: linux-x86_64 }

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Says plainly, in the build log, what this artifact will and will not be. An
      # unsigned build that looks signed is the failure mode worth preventing.
      - name: Report signing status
        shell: bash
        run: |
          echo "Target: ${{ matrix.label }}"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
              echo "macOS signing: configured"
              if [ -n "${{ secrets.APPLE_API_KEY }}" ]; then
                echo "macOS notarization: configured"
              else
                echo "macOS notarization: NOT configured — Gatekeeper will warn on first launch"
              fi
            else
              echo "macOS signing: NOT configured — this artifact is UNSIGNED"
            fi
          fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            if [ -n "${{ secrets.WINDOWS_CERTIFICATE }}" ]; then
              echo "Windows signing: configured"
            else
              echo "Windows signing: NOT configured — this artifact is UNSIGNED"
            fi
          fi
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "Update signature: configured"
          else
            echo "Update signature: NOT configured — in-app updates cannot be verified"
          fi

      - name: Build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # Every one of these is optional. Absent means the build succeeds and the
          # artifact is unsigned — never that the release fails silently half-done.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          # A draft, so a human looks at the artifacts before anyone can download them.
          releaseDraft: true
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
