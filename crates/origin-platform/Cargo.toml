[package]
name = "origin-platform"
description = "Platform contracts for Origin: the OS capabilities domain code is allowed to depend on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["tauri", "platform", "os-abstraction", "notifications"]
categories = ["os", "rust-patterns"]

[features]
default = []
testing = []

[dependencies]
async-trait = { workspace = true }
origin-domain = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
origin-platform = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
