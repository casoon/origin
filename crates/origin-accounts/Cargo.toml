[package]
name = "origin-accounts"
description = "Account management for Origin: several accounts per connector, credentials kept out of the database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["tauri", "accounts", "multi-account", "credentials"]
categories = ["authentication"]

[dependencies]
origin-auth = { workspace = true }
origin-domain = { workspace = true }
origin-events = { workspace = true }
origin-storage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
origin-domain = { workspace = true, features = ["testing"] }
origin-storage = { workspace = true }
origin-secrets = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
