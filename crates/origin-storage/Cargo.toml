[package]
name = "origin-storage"
description = "Storage port and TTL cache for Origin. Knows no storage engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["tauri", "storage", "ttl-cache", "cache"]
categories = ["caching", "database"]

[features]
default = []
testing = []

[dependencies]
async-trait = { workspace = true }
origin-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
origin-domain = { workspace = true, features = ["testing"] }
origin-storage = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
