[package]
name = "origin-auth"
description = "OAuth 2.0 authorization code flow with PKCE, token storage and refresh for Origin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["oauth2", "pkce", "authentication", "tauri"]
categories = ["authentication", "web-programming"]

[features]
default = []
testing = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
origin-domain = { workspace = true }
origin-http = { workspace = true }
origin-platform = { workspace = true }
origin-secrets = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
origin-auth = { path = ".", features = ["testing"] }
origin-domain = { workspace = true, features = ["testing"] }
origin-http = { workspace = true, features = ["testing"] }
origin-platform = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
