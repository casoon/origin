[package]
name = "origin-connector"
description = "The connector contract for Origin: what an external service integration must declare and support."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["tauri", "connector", "integration", "contract"]
categories = ["api-bindings", "rust-patterns"]

[features]
default = []
ts = ["dep:ts-rs", "origin-domain/ts"]

[dependencies]
async-trait = { workspace = true }
origin-domain = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
