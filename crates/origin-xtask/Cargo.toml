[package]
name = "origin-xtask"
description = "Origin maintenance tasks as a library, so a derivative's xtask is three lines and its rules arrive with a version bump."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
origin-app = { workspace = true, features = ["ts"] }
origin-connector = { workspace = true, features = ["ts"] }
origin-core = { workspace = true, features = ["ts"] }
origin-events = { workspace = true, features = ["ts"] }
origin-manifest = { workspace = true }
origin-sync = { workspace = true, features = ["ts"] }
toml = { workspace = true }
toml_edit = "0.25"
ts-rs = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
