[package]
name = "origin-demo"
description = "Reference application showing how an Origin app is assembled."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "origin_demo"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
async-trait = { workspace = true }
origin-ai = { workspace = true }
origin-app = { workspace = true }
origin-connector = { workspace = true }
origin-domain = { workspace = true, features = ["ts"] }
origin-events = { workspace = true }
origin-platform = { workspace = true }
origin-settings = { workspace = true }
origin-storage = { workspace = true }
origin-mcp = { workspace = true }
origin-mcp-stdio = { workspace = true }
origin-secrets = { workspace = true }
origin-storage-sqlite = { workspace = true }
origin-sync = { workspace = true }
origin-tauri = { workspace = true }
origin-telemetry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
origin-domain = { workspace = true, features = ["testing"] }
origin-platform = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
